name: Feature request
description: 提出一个希望支持的场景
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的场景
      description: 描述实际使用中遇到的限制，而不是直接给实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法（可选）
  - type: textarea
    id: alternatives
    attributes:
      label: 试过的替代方案（可选）
